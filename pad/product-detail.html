<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>製品詳細 | PAD練習ページ</title>
  <style>
    body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; background:#f3f6f9; color:#243140; margin:0; }
    header { background:#244766; color:white; padding:18px 28px; }
    main { max-width:800px; margin:28px auto; background:white; border:1px solid #ccd6df; border-radius:8px; padding:24px; }
    a { color:#12669c; }
    .box { background:#edf3f7; padding:18px; border-radius:6px; margin:18px 0; }
  </style>
</head>
<body>
<header><h1>PAD練習ページ 製品詳細</h1></header>
<main>
  <h2 id="title">製品詳細ページ</h2>
  <div class="box">
    <p>製品コード：<strong id="productCode"></strong></p>
    <p>この画面は、PADでの画面遷移確認用です。</p>
  </div>
  <a href="pad_product_search.html" id="backLink">検索画面へ戻る</a>
</main>
<script>
  const id = new URLSearchParams(location.search).get("id") || "未指定";
  document.getElementById("productCode").textContent = id;
  document.getElementById("title").textContent = id + " 製品詳細";
</script>
</body>
</html>
